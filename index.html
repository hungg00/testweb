069\u0020\u0072\u1ed1\u0069\u0022\u002c\u0022\ud83d\ude15\u0022\u002c\u0031\u002c\u005b\u0022\u0047\u0069\u1ea3\u006e\u0067\u0020\u0076\u0069\u00ea\u006e\u0020\u0067\u0069\u1ea3\u0069\u0020\u0062\u00e0\u0069\u0020\u006d\u00f4\u006e\u0020\u007b\u006d\u007d\u0020\u0071\u0075\u00e1\u0020\u006e\u0068\u0061\u006e\u0068\u0020\u0076\u00e0\u0020\u0062\u1ea1\u006e\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0074\u0068\u0065\u006f\u0020\u006b\u1ecb\u0070\u0022\u002c\u0022\u0110\u1ec1\u0020\u0062\u00e0\u0069\u0020\u006d\u00f4\u006e\u0020\u007b\u006d\u007d\u0020\u006d\u01a1\u0020\u0068\u1ed3\u002c\u0020\u0062\u1ea1\u006e\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0062\u0069\u1ebf\u0074\u0020\u0062\u1eaf\u0074\u0020\u0111\u1ea7\u0075\u0020\u0074\u1eeb\u0020\u0111\u00e2\u0075\u0022\u002c\u0022\u0048\u0061\u0069\u0020\u0062\u1ea1\u006e\u0020\u0074\u0072\u006f\u006e\u0067\u0020\u006e\u0068\u00f3\u006d\u0020\u0063\u0068\u1ec9\u0020\u0068\u0061\u0069\u0020\u0063\u00e1\u0063\u0068\u0020\u006c\u00e0\u006d\u0020\u006b\u0068\u00e1\u0063\u0020\u006e\u0068\u0061\u0075\u0020\u0063\u0068\u006f\u0020\u006d\u00f4\u006e\u0020\u007b\u006d\u007d\u0022\u005d\u002c\u005b\u0022\u0042\u1ea1\u006e\u0020\u006e\u0068\u00ec\u006e\u0020\u0111\u1ec1\u0020\u006d\u00e3\u0069\u0020\u006d\u00e0\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0062\u0069\u1ebf\u0074\u0020\u006c\u00e0\u006d\u0020\u0067\u00ec\u002e\u0022\u002c\u0022\u0042\u1ea1\u006e\u0020\u006e\u0068\u00ed\u0075\u0020\u006d\u00e0\u0079\u0020\u0076\u00e0\u0020\u0111\u1ecd\u0063\u0020\u006c\u1ea1\u0069\u0020\u006e\u0068\u0069\u1ec1\u0075\u0020\u006c\u1ea7\u006e\u002e\u0022\u002c\u0022\u0042\u1ea1\u006e\u0020\u006d\u0075\u1ed1\u006e\u0020\u0068\u1ecf\u0069\u0020\u006e\u0068\u01b0\u006e\u0067\u0020\u0063\u0068\u01b0\u0061\u0020\u0062\u0069\u1ebf\u0074\u0020\u0068\u1ecf\u0069\u0020\u0067\u00ec\u002e\u0022\u005d\u002c\u0022\u0058\u0075\u1ea5\u0074\u0020\u0068\u0069\u1ec7\u006e\u0020\u006b\u0068\u0069\u0020\u0074\u0068\u00f4\u006e\u0067\u0020\u0074\u0069\u006e\u0020\u0074\u0068\u0069\u1ebf\u0075\u0020\u0072\u00f5\u0020\u0072\u00e0\u006e\u0067\u0020\u0068\u006f\u1eb7\u0063\u0020\u006d\u00e2\u0075\u0020\u0074\u0068\u0075\u1eab\u006e\u002e\u0022\u002c\u0022\u0048\u00e3\u0079\u0020\u0067\u0068\u0069\u0020\u0072\u0061\u0020\u0111\u0069\u1ec1\u0075\u0020\u0063\u0068\u01b0\u0061\u0020\u0072\u00f5\u0020\u0072\u1ed3\u0069\u0020\u0068\u1ecf\u0069\u0020\u006d\u1ed9\u0074\u0020\u0063\u00e2\u0075\u0020\u0063\u1ee5\u0020\u0074\u0068\u1ec3\u002e\u0022\u005d\u002c\u000a\u005b\u0022\u0054\u1ee9\u0063\u0020\u0067\u0069\u1ead\u006e\u0022\u002c\u0022\ud83d\ude20\u0022\u002c\u0032\u002c\u005b\u0022\u0042\u1ea1\u006e\u0020\u0063\u00f9\u006e\u0067\u0020\u006e\u0068\u00f3\u006d\u0020\u006d\u00f4\u006e\u0020\u007b\u006d\u007d\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u006c\u00e0\u006d\u0020\u0070\u0068\u1ea7\u006e\u0020\u0076\u0069\u1ec7\u0063\u0020\u0111\u00e3\u0020\u006e\u0068\u1ead\u006e\u0022\u002c\u0022\u0043\u00f3\u0020\u006e\u0067\u01b0\u1edd\u0069\u0020\u0064\u00f9\u006e\u0067\u0020\u00fd\u0020\u0074\u01b0\u1edf\u006e\u0067\u0020\u0063\u1ee7\u0061\u0020\u0062\u1ea1\u006e\u0020\u0074\u0072\u006f\u006e\u0067\u0020\u0062\u00e0\u0069\u0020\u006d\u00f4\u006e\u0020\u007b\u006d\u007d\u0020\u006d\u00e0\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u006e\u00f3\u0069\u0020\u0067\u00ec\u0022\u002c\u0022\u0042\u1ea1\u006e\u0020\u0062\u1ecb\u0020\u0074\u0072\u1eeb\u0020\u0111\u0069\u1ec3\u006d\u0020\u006d\u00f4\u006e\u0020\u007b\u006d\u007d\u0020\u0076\u00ec\u0020\u006c\u1ed7\u0069\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0070\u0068\u1ea3\u0069\u0020\u0063\u1ee7\u0061\u0020\u006d\u00ec\u006e\u0068\u0022\u005d\u002c\u005b\u0022\u0042\u1ea1\u006e\u0020\u006e\u0067\u0068\u0069\u1ebf\u006e\u0020\u0072\u0103\u006e\u0067\u0020\u0076\u00e0\u0020\u006e\u00f3\u006e\u0067\u0020\u006d\u1eb7\u0074\u002e\u0022\u002c\u0022\u0042\u1ea1\u006e\u0020\u006d\u0075\u1ed1\u006e\u0020\u006e\u00f3\u0069\u0020\u006c\u1edb\u006e\u0020\u0074\u0069\u1ebf\u006e\u0067\u0020\u006e\ 04e\u0068\u01b0\u006e\u0067\u0020\u007b\u006e\u007d\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0063\u1ea7\u006e\u0020\u0067\u0069\u1ea3\u0069\u0020\u0071\u0075\u0079\u1ebf\u0074\u0020\u0074\u1ea5\u0074\u0020\u0063\u1ea3\u0020\u006e\u0067\u0061\u0079\u0020\u0062\u00e2\u0079\u0020\u0067\u0069\u1edd\u002e\u0027\u002c\u0027\u0110\u0069\u1ec1\u0075\u0020\u0111\u0061\u006e\u0067\u0020\u006c\u00e0\u006d\u0020\u007b\u006e\u007d\u0020\u006c\u006f\u0020\u006e\u0068\u1ea5\u0074\u0020\u006c\u00e0\u0020\u0067\u00ec\u003f\u0020\u004d\u00ec\u006e\u0068\u0020\u0074\u0068\u1eed\u0020\u0063\u0068\u0069\u0061\u0020\u006e\u0068\u1ecf\u0020\u006e\u00f3\u0020\u0072\u0061\u0020\u0063\u00f9\u006e\u0067\u0020\u007b\u006e\u007d\u0020\u006e\u0068\u00e9\u002e\u0027\u005d\u005d\u002c\u000a\u0020\u0074\u0069\u0072\u0065\u0064\u003a\u005b\u000a\u0020\u0020\u005b\u0027\u007b\u006e\u007d\u0020\u0111\u00e3\u0020\u0063\u1ed1\u0020\u0067\u1eaf\u006e\u0067\u0020\u006e\u0068\u0069\u1ec1\u0075\u0020\u0072\u1ed3\u0069\u002e\u0020\u004e\u0067\u0068\u1ec9\u0020\u006d\u1ed9\u0074\u0020\u0063\u0068\u00fa\u0074\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0070\u0068\u1ea3\u0069\u0020\u006c\u00e0\u0020\u006c\u01b0\u1edd\u0069\u0020\u0111\u00e2\u0075\u0020\ud83c\udf19\u0027\u002c\u0027\u0054\u0068\u1ea3\u0020\u006c\u1ecf\u006e\u0067\u0020\u0076\u0061\u0069\u0020\u0078\u0075\u1ed1\u006e\u0067\u002c\u0020\u0075\u1ed1\u006e\u0067\u0020\u006d\u1ed9\u0074\u0020\u006e\u0067\u1ee5\u006d\u0020\u006e\u01b0\u1edb\u0063\u0020\u006e\u0068\u00e9\u002e\u0020\u004d\u00ec\u006e\u0068\u0020\u0063\u0068\u0075\u0079\u1ec3\u006e\u0020\u0073\u0061\u006e\u0067\u0020\u0062\u0075\u1ed5\u0069\u0020\u0111\u00ea\u006d\u0020\u0063\u00f3\u0020\u0111\u006f\u006d\u0020\u0111\u00f3\u006d\u0020\u0063\u0068\u006f\u0020\u007b\u006e\u007d\u0020\u0074\u0068\u01b0\u0020\u0067\u0069\u00e3\u006e\u002e\u0027\u005d\u002c\u000a\u0020\u0020\u005b\u0027\u004d\u1ec7\u0074\u0020\u0074\u0068\u00ec\u0020\u006d\u00ec\u006e\u0068\u0020\u006e\u0067\u0068\u1ec9\u0020\u006e\u0068\u00e9\u002c\u0020\u0068\u00f4\u006d\u0020\u006e\u0061\u0079\u0020\u007b\u006e\u007d\u0020\u0111\u00e3\u0020\u006c\u00e0\u006d\u0020\u0111\u1ee7\u0020\u006e\u0068\u0069\u1ec1\u0075\u0020\u0072\u1ed3\u0069\u002e\u0027\u002c\u0027\u007b\u006e\u007d\u0020\u006d\u1ec7\u0074\u0020\u0076\u00ec\u0020\u0063\u01a1\u0020\u0074\u0068\u1ec3\u002c\u0020\u0068\u0061\u0079\u0020\u0076\u00ec\u0020\u0074\u0072\u006f\u006e\u0067\u0020\u006c\u00f2\u006e\u0067\u0020\u0063\u00f3\u0020\u0111\u0069\u1ec1\u0075\u0020\u0067\u00ec\u0020\u006e\u1eb7\u006e\u0067\u0020\u006e\u1ec1\u003f\u0027\u005d\u005d\u002c\u000a\u0020\u0061\u006e\u0067\u0072\u0079\u003a\u005b\u000a\u0020\u0020\u005b\u0027\u004e\u0067\u0068\u0065\u0020\u0063\u00f3\u0020\u0076\u1ebb\u0020\u0063\u0068\u0075\u0079\u1ec7\u006e\u0020\u0111\u00f3\u0020\u006c\u00e0\u006d\u0020\u007b\u006e\u007d\u0020\u0072\u1ea5\u0074\u0020\u0062\u1ef1\u0063\u002e\u0020\u0047\u0069\u1ead\u006e\u0020\u006c\u00e0\u0020\u006d\u1ed9\u0074\u0020\u0063\u1ea3\u006d\u0020\u0078\u00fa\u0063\u0020\u0068\u1ee3\u0070\u0020\u006c\u00fd\u0020\u006b\u0068\u0069\u0020\u006d\u00ec\u006e\u0068\u0020\u0074\u0068\u1ea5\u0079\u0020\u0062\u1ea5\u0074\u0020\u0063\u00f4\u006e\u0067\u002e\u0027\u002c\u0027\u007b\u006e\u007d\u0020\u0063\u1ee9\u0020\u0078\u1ea3\u0020\u0068\u1ebf\u0074\u0020\u0072\u0061\u0020\u0111\u00e2\u0079\u002c\u0020\u006d\u00ec\u006e\u0068\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0070\u0068\u00e1\u006e\u0020\u0078\u00e9\u0074\u0020\u0111\u00e2\u0075\u002e\u0020\u0043\u0068\u0075\u0079\u1ec7\u006e\u0020\u0067\u00ec\u0020\u0111\u00e3\u0020\u0078\u1ea3\u0079\u0020\u0072\u0061\u0020\u0076\u1ead\u0079\u003f\u0027\u005d\u002c\u000a\u0020\u0020\u005b\u0027\u004d\u00ec\u006e\u0068\u0020\u0068\u0069\u1ec3\u0075\u002c\u0020\u0067\u1eb7\u0070\u0020\u0063\u0068\u0075\u0079\u1ec7\u006e\u0020\u006e\u0068\u01b0\u0020\u0076\u1ead\u0079\u0020\u0061\u0069\u0020\u0063\u0169\u006e\u0067\u0020\u006b\u0068\u00f3\u0020\u0063\u0068\u1ecb\u0075\u002e\u0020\u0048\ 067\u01b0\u1edd\u0069\u002e\u0020\u004d\u00ec\u006e\u0068\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0074\u0068\u0061\u0079\u0020\u0074\u0068\u1ebf\u0020\u006e\u0067\u01b0\u1edd\u0069\u0020\u0074\u0068\u00e2\u006e\u0020\u0068\u0061\u0079\u0020\u0063\u0068\u0075\u0079\u00ea\u006e\u0020\u0067\u0069\u0061\u002c\u0020\u006e\u0068\u01b0\u006e\u0067\u0020\u006d\u00ec\u006e\u0068\u0020\u1edf\u0020\u0111\u00e2\u0079\u0020\u0111\u1ec3\u0020\u006c\u1eaf\u006e\u0067\u0020\u006e\u0067\u0068\u0065\u0020\u007b\u006e\u007d\u0020\u0074\u0068\u1ead\u0074\u0020\u006c\u00f2\u006e\u0067\u0020\ud83c\udf38\u0027\u002c\u0027\u0048\u00f4\u006d\u0020\u006e\u0061\u0079\u0020\u007b\u006e\u007d\u0020\u006d\u0075\u1ed1\u006e\u0020\u006b\u1ec3\u0020\u006d\u00ec\u006e\u0068\u0020\u006e\u0067\u0068\u0065\u0020\u0111\u0069\u1ec1\u0075\u0020\u0067\u00ec\u003f\u0027\u005d\u003b\u000a\u0020\u0020\u007d\u0065\u006c\u0073\u0065\u0020\u0069\u0066\u0028\u0052\u0058\u002e\u0075\u006e\u0064\u0065\u0072\u0073\u0074\u0061\u006e\u0064\u002e\u0074\u0065\u0073\u0074\u0028\u006e\u0029\u0029\u007b\u000a\u0020\u0020\u0020\u0020\u0070\u0061\u0072\u0074\u0073\u003d\u005b\u0027\u004d\u00ec\u006e\u0068\u0020\u0111\u0061\u006e\u0067\u0020\u0063\u1ed1\u0020\u0068\u0069\u1ec3\u0075\u0020\u0074\u1eeb\u006e\u0067\u0020\u006c\u1edd\u0069\u0020\u007b\u006e\u007d\u0020\u006e\u00f3\u0069\u002e\u0020\u004e\u1ebf\u0075\u0020\u006d\u00ec\u006e\u0068\u0020\u0068\u0069\u1ec3\u0075\u0020\u0073\u0061\u0069\u0020\u0063\u0068\u1ed7\u0020\u006e\u00e0\u006f\u002c\u0020\u007b\u006e\u007d\u0020\u0063\u1ee9\u0020\u0073\u1eed\u0061\u0020\u006d\u00ec\u006e\u0068\u0020\u006e\u0068\u00e9\u002c\u0020\u006d\u00ec\u006e\u0068\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0067\u0069\u1ead\u006e\u0020\u0111\u00e2\u0075\u0020\ud83c\udf37\u0027\u005d\u003b\u000a\u0020\u0020\u007d\u0065\u006c\u0073\u0065\u0020\u0069\u0066\u0028\u0052\u0058\u002e\u0062\u0065\u0074\u0074\u0065\u0072\u002e\u0074\u0065\u0073\u0074\u0028\u006e\u0029\u0029\u007b\u000a\u0020\u0020\u0020\u0020\u006e\u0065\u0067\u0053\u0074\u0072\u0065\u0061\u006b\u003d\u0030\u003b\u006f\u0075\u0074\u0045\u006d\u006f\u003d\u0027\u0068\u0061\u0070\u0070\u0079\u0027\u003b\u000a\u0020\u0020\u0020\u0020\u0070\u0061\u0072\u0074\u0073\u003d\u005b\u0027\u004d\u00ec\u006e\u0068\u0020\u006d\u1eeb\u006e\u0067\u0020\u006c\u1eaf\u006d\u0020\ud83c\udf37\u0020\u007b\u006e\u007d\u0020\u0076\u1eeb\u0061\u0020\u006c\u00e0\u006d\u0020\u0111\u0069\u1ec1\u0075\u0020\u0072\u1ea5\u0074\u0020\u0074\u1ed1\u0074\u0020\u0063\u0068\u006f\u0020\u0063\u0068\u00ed\u006e\u0068\u0020\u006d\u00ec\u006e\u0068\u0020\u0111\u00f3\u002e\u0027\u002c\u0027\u007b\u006e\u007d\u0020\u006e\u0067\u0068\u0129\u0020\u0111\u0069\u1ec1\u0075\u0020\u0067\u00ec\u0020\u0111\u00e3\u0020\u0067\u0069\u00fa\u0070\u0020\u007b\u006e\u007d\u0020\u006e\u0068\u1eb9\u0020\u0068\u01a1\u006e\u0020\u006e\u0068\u0069\u1ec1\u0075\u0020\u006e\u0068\u1ea5\u0074\u003f\u0020\u004d\u00ec\u006e\u0068\u0020\u006d\u0075\u1ed1\u006e\u0020\u006e\u0068\u1edb\u0020\u006c\u1ea1\u0069\u0020\u0063\u00f9\u006e\u0067\u0020\u007b\u006e\u007d\u0020\u0063\u0068\u006f\u0020\u006c\u1ea7\u006e\u0020\u0073\u0061\u0075\u002e\u0027\u005d\u003b\u000a\u0020\u0020\u007d\u0065\u006c\u0073\u0065\u0020\u0069\u0066\u0028\u0021\u006e\u0065\u0067\u0026\u0026\u0065\u006d\u006f\u0021\u003d\u003d\u0027\u0068\u0061\u0070\u0070\u0079\u0027\u0026\u0026\u0028\u0052\u0058\u002e\u0074\u0068\u0061\u006e\u006b\u0073\u002e\u0074\u0065\u0073\u0074\u0028\u006e\u0029\u007c\u007c\u0052\u0058\u002e\u0062\u0079\u0065\u002e\u0074\u0065\u0073\u0074\u0028\u006e\u0029\u007c\u007c\u0052\u0058\u002e\u0067\u0072\u0065\u0065\u0074\u002e\u0074\u0065\u0073\u0074\u0028\u006e\u0029\u0029\u0029\u007b\u000a\u0020\u0020\u0020\u0020\u0070\u0061\u0072\u0074\u0073\u003d\u0070\u0069\u0063\u006b\u0028\u0052\u0058\u002e\u0062\u0079\u0065\u002e\u0074\u0065\u0073\u0074\u0028\u006e\u0029\u003f\u0027\u0062\u0079\u0065\u0027\u003a\u0052\u0058\u002e\u0074\u0068\u0061\u006e\u006b\u0073\u002e\u0074\u0065\ 020\u0063\u0061\u0074\u0063\u0068\u0028\u0065\u0072\u0072\u0029\u007b\u0050\u004c\u002e\u0070\u0075\u0073\u0068\u0028\u007b\u006e\u0061\u006d\u0065\u003a\u006e\u006d\u002b\u0027\u0020\u0028\u0074\u1ea1\u006d\u0029\u0027\u002c\u0075\u0072\u006c\u003a\u0055\u0052\u004c\u002e\u0063\u0072\u0065\u0061\u0074\u0065\u004f\u0062\u006a\u0065\u0063\u0074\u0055\u0052\u004c\u0028\u0066\u0029\u007d\u0029\u003b\u0074\u006d\u0070\u003d\u0074\u0072\u0075\u0065\u007d\u000a\u0020\u0020\u0020\u0020\u0069\u0066\u0028\u0066\u0069\u0072\u0073\u0074\u003c\u0030\u0029\u0066\u0069\u0072\u0073\u0074\u003d\u0050\u004c\u002e\u006c\u0065\u006e\u0067\u0074\u0068\u002d\u0031\u003b\u000a\u0020\u0020\u007d\u000a\u0020\u0020\u0072\u0065\u006e\u0064\u0065\u0072\u004c\u0069\u0073\u0074\u0028\u0029\u003b\u000a\u0020\u0020\u0069\u0066\u0028\u0074\u006d\u0070\u0029\u0061\u006c\u0065\u0072\u0074\u0028\u0027\u0054\u0072\u00ec\u006e\u0068\u0020\u0064\u0075\u0079\u1ec7\u0074\u0020\u006b\u0068\u00f4\u006e\u0067\u0020\u0063\u0068\u006f\u0020\u006c\u01b0\u0075\u0020\u006e\u0068\u1ea1\u0063\u0020\u1edf\u0020\u0063\u0068\u1ebf\u0020\u0111\u1ed9\u0020\u006e\u00e0\u0079\u0020\u006e\u00ea\u006e\u0020\u0062\u00e0\u0069\u0020\u0076\u1eeb\u0061\u0020\u0074\u0068\u00ea\u006d\u0020\u0063\u0068\u1ec9\u0020\u006e\u0067\u0068\u0065\u0020\u0111\u01b0\u1ee3\u0063\u0020\u0074\u0072\u006f\u006e\u0067\u0020\u006c\u1ea7\u006e\u0020\u006d\u1edf\u0020\u006e\u00e0\u0079\u002e\u0020\u0048\u00e3\u0079\u0020\u006d\u1edf\u0020\u0074\u0072\u0061\u006e\u0067\u0020\u0071\u0075\u0061\u0020\u0077\u0065\u0062\u0020\u0028\u0047\u0069\u0074\u0048\u0075\u0062\u0020\u0050\u0061\u0067\u0065\u0073\u0029\u0020\u0111\u1ec3\u0020\u006e\u0068\u1ea1\u0063\u0020\u0111\u01b0\u1ee3\u0063\u0020\u006c\u01b0\u0075\u0020\u006c\u1ea1\u0069\u002e\u0027\u0029\u003b\u000a\u0020\u0020\u0069\u0066\u0028\u0066\u0069\u0072\u0073\u0074\u003e\u003d\u0030\u0029\u007b\u004d\u0055\u002e\u006f\u006e\u003d\u0074\u0072\u0075\u0065\u003b\u0024\u0028\u0027\u006d\u0075\u0027\u002
